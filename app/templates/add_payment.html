{% extends "base.html" %}
{% block title %}Add Payment — {{ pool.name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Record Payment</h1>
  <a href="/pools/{{ pool.id }}" class="btn-outline">← Back to Pool</a>
</div>

<div class="card form-card">
  <p class="meta">Pool: <strong>{{ pool.name }}</strong></p>
  {% if error %}
    <div class="flash flash-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/pools/{{ pool.id }}/payments/add" class="form">
    <div class="form-group">
      <label for="paid_by_member_id">Paid By (Member)</label>
      <select id="paid_by_member_id" name="paid_by_member_id" required>
        {% for m in members %}
        <option value="{{ m.id }}">{{ m.user.name }} ({{ m.role.value }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" name="amount" required min="0.01" step="0.01" placeholder="500.00">
    </div>
    <div class="form-group">
      <label for="payment_method">Payment Method</label>
      <select id="payment_method" name="payment_method" required>
        {% for method in methods %}
        <option value="{{ method }}">{{ method }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="note">Note (optional)</label>
      <input type="text" id="note" name="note" placeholder="e.g. Partial contribution">
    </div>
    <button type="submit" class="btn-primary">Record Payment</button>
    <a href="/pools/{{ pool.id }}" class="btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
