{% extends "base.html" %}
{% block title %}Register — GiftPool{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create Account</h1>
  {% if error %}
    <div class="flash flash-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/register" class="form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
    </div>
    <button type="submit" class="btn-primary btn-block">Register</button>
  </form>
  <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
